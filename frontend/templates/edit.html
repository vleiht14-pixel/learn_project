<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование заявки</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Редактирование заявки #{{ data.id }}</h1>

        {% if error %}
            <div class="alert alert-danger">
                <strong>Внимание:</strong> {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/edit/{{ data.id }}" class="repair-form">
            <div class="form-group">
                <label>Марка и модель автомобиля:</label>
                <input type="text" name="car_model" value="{{ data.car_model }}" required>
            </div>

            <div class="form-group">
                <label>Телефон владельца:</label>
                <input type="tel" name="phone_number" value="{{ data.phone_number }}"
                       pattern="[\+0-9\-\(\)\s]+"
                       title="Допускаются только цифры, пробелы и символы +, -, (, )" required>
            </div>

            <div class="form-group">
                <label>Описание проблемы/работ:</label>
                <input type="text" name="issue" value="{{ data.issue }}" required>
            </div>

            <div class="form-group">
                <label>Примерная стоимость (₽):</label>
                <input type="number" step="0.01" name="estimated_cost" value="{{ data.estimated_cost }}" required>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="is_completed" {% if data.is_completed %}checked{% endif %}> Работы завершены
                </label>
            </div>

            <button type="submit" class="btn">Обновить данные</button>
            <a href="/" class="btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
