<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая заявка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Добавление автомобиля</h1>

        {% if error %}
            <div class="alert alert-danger">
                <strong>Внимание:</strong> {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/create" class="repair-form">
            <div class="form-group">
                <label>Марка и модель автомобиля:</label>
                <input type="text" name="car_model" value="{{ data.car_model if data else '' }}" placeholder="Например: Mazda Familia" required>
            </div>

            <div class="form-group">
                <label>Телефон владельца:</label>
                <input type="tel" name="phone_number" value="{{ data.phone_number if data else '' }}"
                placeholder="+7 (999) 000-00-00"
                pattern="[\+0-9\-\(\)\s]+"
                title="Допускаются только цифры, пробелы и символы +, -, (, )" required>
            </div>

            <div class="form-group">
                <label>Описание проблемы/работ:</label>
                <input type="text" name="issue" value="{{ data.issue if data else '' }}" placeholder="Например: Переборка Z5-DE, покраска в crystal white" required>
            </div>

            <div class="form-group">
                <label>Примерная стоимость (₽):</label>
                <input type="number" step="0.01" name="estimated_cost" value="{{ data.estimated_cost if data else '' }}" placeholder="15000" required>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="is_completed" {% if data and data.is_completed %}checked{% endif %}> Работы завершены сразу
                </label>
            </div>

            <button type="submit" class="btn">Сохранить заявку</button>
            <a href="/" class="btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
