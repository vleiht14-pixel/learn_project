<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новая заявка</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Добавление автомобиля в сервис</h1>

        {% if error %}
            <div class="error" style="color: red; margin-bottom: 15px;">Ошибка: {{ error }}</div>
        {% endif %}

        <form method="post" action="/create" class="repair-form">
            <div class="form-group">
                <label>Марка и модель автомобиля:</label>
                <input type="text" name="car_model" placeholder="Например: Mazda Familia" required>
            </div>

            <div class="form-group">
                <label>Описание проблемы/работ:</label>
                <input type="text" name="issue" placeholder="Например: Переборка Z5-DE, покраска в crystal white" required>
            </div>

            <div class="form-group">
                <label>Примерная стоимость (₽):</label>
                <input type="number" step="0.01" name="estimated_cost" placeholder="15000" required>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="is_completed"> Работы завершены
                </label>
            </div>

            <button type="submit" class="btn">Сохранить заявку</button>
            <a href="/" class="btn-secondary" style="margin-left: 10px; text-decoration: none;">Отмена</a>
        </form>
    </div>
</body>
</html>
